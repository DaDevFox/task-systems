syntax = "proto3";

package taskcore.v1;

option go_package = "github.com/DaDevFox/task-systems/tasker-core/backend/pkg/proto/taskcore/v1";

message APIResource {
    string url=1;
    string response_valid_regex=2;
}

message FileAttachmentResource {
    string file_location = 1;
}

// ... more resource types

// configures an expected result
message Resource {
    oneof resource {
        APIResource api_resource = 1;
        FileAttachmentResource file_attachment_resource = 2;
        // ... more resource types
    }
}

