syntax = "proto3";

package taskcore.v1;

option go_package = "github.com/DaDevFox/task-systems/tasker-core/backend/pkg/proto/taskcore/v1";

message FormResult {
    string open_url = 1;
    string response_check_url=2;
}

message FileAttachmentResult {
    string file_location = 1;
}

// ... more result types

// configures an expected result
message Result {
    oneof result {
        FormResult form_result = 1;
        FileAttachmentResult file_attachment_result = 2;
        // ... more result types
    }
}

// tracks progress towards a result in a task
message TaskResult {
    string requirement_id = 1;
    Result result = 2;
    bool complete = 3;
}

