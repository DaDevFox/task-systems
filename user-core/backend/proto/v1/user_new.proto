syntax = "proto3";
// TODO:
// https://golang.elitedev.in/golang/production-ready-grpc-microservices-in-go-authentication-service-discovery-and-observability-guid-865353d1/
// https://dev.to/techschoolguru/use-grpc-interceptor-for-authorization-with-jwt-1c5h

package user;

option go_package = "github.com/DaDevFox/task-systems/user-core/backend/pkg/proto/v1";


message User {
  string id = 1; // unique against Group + User ids
  string username = 2;
  string email = 3;
  string phone_number = 4;
  string first_name = 5;
  string middle_name = 6;
  string last_name = 7;
}

